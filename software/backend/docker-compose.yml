name: cactai

services:
  db:
    image: postgres:16
    container_name: cactai
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cactai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cactai-data:/var/lib/postgresql/data
      - .db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  cactai-data:
    name: cactai-data